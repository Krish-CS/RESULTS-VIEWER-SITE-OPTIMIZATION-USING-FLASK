<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marksheet for {{ name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="galaxy">
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="glow-overlay"></div>
    <div class="star-field">
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
    </div>

    <div class="login-box wide">
        <h2>Hello {{ name }} 🎓</h2>
        <p>Your marksheet will start downloading automatically. Click Next to open gift claim page.</p>
        <h3>Marksheet</h3>
        <embed src="{{ url_for('marksheet_file', filename=marksheet_file) }}" type="application/pdf" class="pdf-frame">
        <div class="action-row">
            <a href="{{ url_for('marksheet_file', filename=marksheet_file) }}" download class="btn">Download Marksheet</a>
            <button type="button" class="btn" onclick="claimGift('{{ reg_no }}', '{{ cert_id }}')">🎁 Claim KAI Gift</button>
        </div>
    </div>
    <script>
        window.addEventListener('load', function(){
            const marksUrl = "{{ url_for('marksheet_file', filename=marksheet_file) }}";
            const a = document.createElement('a');
            a.href = marksUrl;
            a.download = '{{ marksheet_file }}';
            document.body.appendChild(a);
            a.click();
            a.remove();
        });

        function claimGift(rollNumber, certNumber) {
            const baseUrl = "https://krish-repox.onrender.com";
            const targetUrl = `${baseUrl}/claim?roll=${encodeURIComponent(rollNumber)}&cert=${encodeURIComponent(certNumber)}`;
            window.location.href = targetUrl;
        }
    </script>
</body>
</html>
