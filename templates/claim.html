<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim your gift</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    :root {
      --gold-light: #fff8d6;
      --gold-main: #ffd700;
      --gold-metallic: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --gold-dark: #8a6d3b;
      --ribbon-red: #d41434;
      --ribbon-satin: linear-gradient(90deg, #800000 0%, #c41e3a 50%, #800000 100%);
    }

    .giftx-wrap {
      position: relative;
      margin: 10px auto 6px auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .giftx-glow-bg {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.14) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    .giftx-floor-shadow {
      position: absolute;
      bottom: 26px;
      width: 150px;
      height: 18px;
      background: rgba(0,0,0,0.24);
      border-radius: 50%;
      filter: blur(8px);
      z-index: 2;
    }

    .giftx-box-wrapper {
      position: relative;
      width: 220px;
      height: auto; /* allow wrapper to size to contents */
      display: flex;
      flex-direction: column; /* trophy above box */
      align-items: center;
      justify-content: flex-start;
      gap: 18px; /* spacing between trophy and box */
      z-index: 5;
      cursor: pointer;
      margin-top: 20px; /* create breathing room under the heading */
    }

    .giftx-floating {
      animation: giftx-float 3s ease-in-out infinite;
    }

    @keyframes giftx-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .giftx-floating-shadow {
      animation: giftx-shadow-scale 3s ease-in-out infinite;
    }

    @keyframes giftx-shadow-scale {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.74); opacity: 0.55; }
    }

    .giftx-box {
      position: relative;
      width: 180px;
      height: 170px;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,0.24));
    }

    .giftx-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 140px;
      background: var(--gold-metallic);
      border-radius: 0 0 12px 12px;
      z-index: 2;
      overflow: hidden;
      border: 1px solid rgba(138, 109, 59, 0.34);
    }

    .giftx-lid {
      position: absolute;
      top: 0;
      left: -10px;
      width: 200px;
      height: 58px; /* Increased height for ribbon visibility */
      background: var(--gold-metallic);
      border-radius: 10px;
      z-index: 4;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      border: 1px solid rgba(138, 109, 59, 0.34);
      transform-origin: center center;
      overflow: hidden;
    }

    .giftx-glint {
      position: absolute;
      top: 0;
      left: -100%;
      width: 52%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.42), transparent);
      transform: skewX(-25deg);
      animation: giftx-glint-move 4s infinite;
    }

    @keyframes giftx-glint-move {
      0% { left: -150%; }
      30%, 100% { left: 250%; }
    }

    .giftx-ribbon-v {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 100%;
      background: var(--ribbon-satin);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.22);
    }

    .giftx-ribbon-h {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 28px;
      background: var(--ribbon-satin);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.22);
    }

    .giftx-bow {
      position: absolute;
      top: -10px; /* Lowered bow so ribbon is not cut */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      z-index: 5;
    }

    .giftx-bow-loop {
      width: 42px;
      height: 42px;
      background: var(--ribbon-red);
      border-radius: 50% 50% 0 50%;
      transform: rotate(45deg);
      box-shadow: -4px 4px 10px rgba(0,0,0,0.2);
      border: 1px solid rgba(0,0,0,0.1);
    }

    .giftx-bow-loop.right {
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg) translateX(-8px);
      box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
    }

    .giftx-bow-center {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      background: var(--ribbon-red);
      border-radius: 6px;
      z-index: 6;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .giftx-reward {
      position: relative;
      top: 0;
      left: 0;
      transform: translateY(20px) scale(0);
      font-size: 72px;
      margin-bottom: 6px;
      opacity: 0;
      z-index: 12;
      filter: drop-shadow(0 12px 28px rgba(255,215,0,0.35));
      pointer-events: none;
    }

    .giftx-claim-btn {
      margin-top: 14px;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(to right, #9b29b9, #f45fcd);
      border: none;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(155, 41, 185, 0.15);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .giftx-claim-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(to right, #f45fcd, #9b29b9);
    }

    .giftx-congrats {
      font-size: 24px;
      font-weight: 900;
      color: #ffd969;
      opacity: 0;
      margin: 0 0 14px 0; /* spacing under text */
      letter-spacing: 1px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.22);
    }

    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    /* Mobile responsive styles */
    @media (max-width: 480px) {
      .giftx-wrap {
        margin: 8px auto 4px auto;
      }

      .giftx-glow-bg {
        width: 280px;
        height: 280px;
      }

      .giftx-box-wrapper {
        width: 180px;
        gap: 14px;
        margin-top: 15px;
      }

      .giftx-box {
        width: 150px;
        height: 145px;
      }

      .giftx-body {
        height: 120px;
      }

      .giftx-lid {
        width: 170px;
        height: 50px;
        left: -10px;
      }

      .giftx-reward {
        font-size: 60px;
      }

      .giftx-congrats {
        font-size: 20px;
        margin: 0 0 10px 0;
      }

      .giftx-claim-btn {
        padding: 10px 22px;
        font-size: 16px;
      }

      .repox-logo {
        width: min(250px, 85%);
      }

      .id-block {
        margin: 6px 0 12px 0;
      }
    }

    @media (max-width: 360px) {
      .giftx-box-wrapper {
        width: 160px;
      }

      .giftx-box {
        width: 130px;
        height: 130px;
      }

      .giftx-body {
        height: 105px;
      }

      .giftx-lid {
        width: 150px;
        height: 45px;
      }

      .giftx-reward {
        font-size: 50px;
      }

      .giftx-congrats {
        font-size: 18px;
      }
    }
  </style>
</head>
<body class="galaxy">
  <canvas id="confetti"></canvas>
  <div class="stars"></div>
  <div class="twinkling"></div>
  <div class="glow-overlay"></div>
  <div class="star-field">
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="layer"></div>
  </div>

  <div class="login-box wide">
    <h2>Repox Gift Claim</h2>
    <img src="{{ url_for('static', filename='assessts/gift-logo.png') }}" alt="Repox Logo" class="repox-logo">
    <div class="id-block">
      <div class="id-row">
        <span class="id-label">Register ID:</span>
        <span class="id-value">{{ reg_no }}</span>
      </div>
      <div class="id-row">
        <span class="id-label">Certificate ID:</span>
        <span class="id-value">{{ cert_id }}</span>
      </div>
    </div>

    <div class="giftx-wrap">
      <div class="giftx-glow-bg"></div>
      <div class="giftx-floor-shadow giftx-floating-shadow" id="giftShadow"></div>

      <p class="giftx-congrats" id="giftCongrats">Claim your Repox gift 🎁</p>

      <div class="giftx-box-wrapper giftx-floating" id="giftWrapper">
        <div class="giftx-reward" id="giftReward">🏆</div>
        <div class="giftx-box" id="giftBox">
          <div class="giftx-lid" id="giftLid">
            <div class="giftx-glint"></div>
            <div class="giftx-ribbon-v"></div>
            <div class="giftx-ribbon-h"></div>
            <div class="giftx-bow">
              <div class="giftx-bow-loop"></div>
              <div class="giftx-bow-center"></div>
              <div class="giftx-bow-loop right"></div>
            </div>
          </div>
          <div class="giftx-body">
            <div class="giftx-glint"></div>
            <div class="giftx-ribbon-v"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button id="openGift" class="btn">Claim Now</button>
    </div>

    <div id="status">Open the gift box to continue.</div>
    <p id="result" style="margin-top:12px"></p>

    <div class="action-row">
      <a href="/" class="btn">Home</a>
    </div>
  </div>

  <script>
    const claimBtn = document.getElementById('openGift');
    const wrapper = document.getElementById('giftWrapper');
    const lid = document.getElementById('giftLid');
    const reward = document.getElementById('giftReward');
    const congrats = document.getElementById('giftCongrats');
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    const shadow = document.getElementById('giftShadow');
    const statusEl = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const rollNumber = params.get('reg_no') || '';
    const certNumber = params.get('cert_id') || '';

    let particles = [];

    function initConfetti() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = window.innerWidth / 2;
        this.y = window.innerHeight / 2;
        this.size = Math.random() * 8 + 4;
        this.speedX = (Math.random() - 0.5) * 15;
        this.speedY = (Math.random() - 0.8) * 18;
        const colors = ['#ffd700', '#daa520', '#ffec8b', '#c41e3a', '#ffffff', '#b8860b'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.gravity = 0.3;
        this.life = 1;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 10;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.speedY += this.gravity;
        this.life -= 0.01;
        this.rotation += this.rotationSpeed;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation * Math.PI / 180);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size / 2);
        ctx.restore();
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.life <= 0) particles.splice(i, 1);
      });
      if (particles.length > 0) requestAnimationFrame(animateConfetti);
    }

    claimBtn.addEventListener('click', () => {
      claimBtn.style.pointerEvents = 'none';
      gsap.to(claimBtn, { opacity: 0, y: 20, duration: 0.3 });
      wrapper.classList.remove('giftx-floating');
      shadow.classList.remove('giftx-floating-shadow');
      gsap.to(shadow, { opacity: 0.2, duration: 0.3 });

      gsap.to(wrapper, {
        x: '+=5',
        yoyo: true,
        repeat: 10,
        duration: 0.05,
        onComplete: () => {
          gsap.to(wrapper, { x: 0, duration: 0.1 });
          openBox();
        }
      });
    });

    function openBox() {
      const tl = gsap.timeline();
      tl.to(lid, {
        y: -165,
        x: 58,
        rotation: 25,
        opacity: 0,
        duration: 0.7,
        ease: 'power3.out'
      });

      tl.to(reward, {
        opacity: 1,
        scale: 1,
        y: 0, /* settle into natural flow above the box */
        duration: 0.9,
        ease: 'elastic.out(1, 0.55)'
      }, '-=0.4');

      tl.to(congrats, {
        opacity: 1,
        y: 6,
        duration: 0.8,
        ease: 'back.out'
      }, '-=0.8');

      for (let i = 0; i < 120; i++) particles.push(new Particle());
      animateConfetti();

      statusEl.textContent = 'Gift opened! Redirecting to Repox...';

      setTimeout(() => {
        // Redirect to Repox frontend hosted on GitHub Pages (frontend-only)
        const baseUrl = 'https://krish-cs.github.io/krish-repox-frontend/static/claim.html';
        const targetUrl = `${baseUrl}?roll=${encodeURIComponent(rollNumber)}&cert=${encodeURIComponent(certNumber)}`;
        window.location.href = targetUrl;
      }, 1400);
    }

    window.addEventListener('resize', initConfetti);
    initConfetti();
  </script>
</body>
</html>
