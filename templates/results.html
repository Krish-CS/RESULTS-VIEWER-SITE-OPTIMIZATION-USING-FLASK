<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .result-embed {
            width: 100%;
            height: 600px;
            max-width: 100%;
            box-sizing: border-box;
        }
        
        @media (max-width: 480px) {
            .result-embed {
                height: 400px;
            }
        }
    </style>
    <script>
        window.onload = function () {
            const link = document.createElement('a');
            link.href = "{{ url_for('static', filename=pdf) }}";
            link.download = "{{ pdf }}";
            link.click();
        }
    </script>
</head>
<body class="galaxy"><div class="stars"></div>
    <div class="star-field">
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="layer"></div>
</div>

<div class="twinkling"></div>
<div class="glow-overlay"></div>

    <div class="login-box wide">
        <h2>Hello {{ user }} 🎓</h2>
        <p>Your result is displayed below and has started downloading automatically.</p>
        <embed src="{{ url_for('static', filename=pdf) }}" type="application/pdf" class="result-embed">
        <div class="action-row">
            <a href="/logout" class="btn">Logout</a>
        </div>
    </div>
</body>
</html>
