<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate for {{ name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="galaxy">
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="glow-overlay"></div>
    <div class="star-field">
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
    </div>

    <div class="login-box wide">
        <h2>Hello {{ name }} 🎓</h2>
        <p>Your certificate will start downloading automatically. Click Next to view your marksheet.</p>
        <h3>Certificate</h3>
        <img src="{{ url_for('certificate_file', filename=cert_file) }}" alt="Certificate" class="cert-image">
        <div class="action-row">
            <a href="{{ url_for('certificate_file', filename=cert_file) }}" download class="btn">Download Certificate</a>
            <form method="POST" action="/marksheet_page">
                <input type="hidden" name="name" value="{{ name }}">
                <input type="hidden" name="cert_file" value="{{ cert_file }}">
                <input type="hidden" name="marksheet_file" value="{{ marksheet_file }}">
                <input type="hidden" name="reg_no" value="{{ reg_no }}">
                <input type="hidden" name="cert_id" value="{{ cert_id }}">
                <button type="submit" class="btn">Next</button>
            </form>
        </div>
        <div class="action-row">
            <a href="/" class="btn">Home</a>
        </div>
    </div>
    <script>
        window.addEventListener('load', function(){
            const certUrl = "{{ url_for('certificate_file', filename=cert_file) }}";
            const a = document.createElement('a');
            a.href = certUrl;
            a.download = '{{ cert_file }}';
            document.body.appendChild(a);
            a.click();
            a.remove();
        });
    </script>
</body>
</html>
